name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-21
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release runner
        run: cargo build --release --package stoffel-vm-runner --bin stoffel-run

      - name: Run tests
        run: |
          cargo test --workspace --all-features -- \
            --skip tests::avss_e2e_integration \
            --skip tests::avss_integration::test_e2e \
            --skip tests::dkg_primitives \
            --skip tests::leader_bootnode_integration \
            --skip tests::mpc_multiplication_integration \
            --skip tests::p2p_integration \
            --skip tests::threshold_signatures \
            --skip turmoil_ \
            --skip tests::vm_mesh_integration \
            --skip tests::vm_mpc_integration \
            --skip tests::vm_turmoil_e2e \
            --skip optimized_aes_at_o3_matches_nist_vector

      - name: Run heavyweight CLI integration tests serially
        run: cargo test -p stoffel-cli --test cli -- --ignored --test-threads=1

      - name: Run local coordinator lifecycle regressions serially
        run: cargo test -p stoffel-vm-runner --test local_coordinator_e2e -- --ignored --test-threads=1 --skip optimized_aes --skip batch_mul

      - name: Upload VM binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: stoffel-run-${{ matrix.os }}
          path: target/release/stoffel-run
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-contexts: |
            coordinator=https://github.com/Stoffel-Labs/stoffel-mpc-coordinator.git#dffffd6e8422dcd107de79730dc4c018cf21415b
            networking=https://github.com/Stoffel-Labs/stoffel-networking.git#49a237aa5df3211224aedf97ab0bf084ad1c8d31
          push: false
          tags: stoffelvm:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          build-contexts: |
            coordinator=https://github.com/Stoffel-Labs/stoffel-mpc-coordinator.git#dffffd6e8422dcd107de79730dc4c018cf21415b
            networking=https://github.com/Stoffel-Labs/stoffel-networking.git#49a237aa5df3211224aedf97ab0bf084ad1c8d31
          push: true
          tags: |
            ghcr.io/stoffel-labs/stoffelvm:latest
            ghcr.io/stoffel-labs/stoffelvm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
