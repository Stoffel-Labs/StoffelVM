name: _publish-crate

# Reusable publish logic for a single workspace crate. Don't trigger this
# directly — each crate has a thin caller workflow (publish-<crate>.yml) that
# invokes it with the crate name. Tags are of the form <crate>-v<semver>,
# e.g. stoffel-vm-types-v0.2.0, so each crate versions independently.

on:
  workflow_call:
    inputs:
      crate:
        description: "Workspace package name to publish"
        required: true
        type: string
      tag:
        description: "Tag for manual runs; empty on tag-push (falls back to ref)"
        required: false
        type: string
        default: ""
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish ${{ inputs.crate }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve crate, tag, version
        id: ref
        env:
          CRATE: ${{ inputs.crate }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"; else tag="${GITHUB_REF_NAME}"; fi
          version="${tag#${CRATE}-v}"
          if [ "$version" = "$tag" ]; then
            echo "Tag '$tag' is not of the form '${CRATE}-v<version>'"; exit 1
          fi
          echo "crate=$CRATE"     >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Fails fast with a clear reason if the crate is at the wrong version,
      # lacks description/license (crates.io rejects those), or is publish=false.
      - name: Validate crate
        env:
          CRATE: ${{ steps.ref.outputs.crate }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, subprocess, os, sys
          crate = os.environ["CRATE"]; want = os.environ["VERSION"]
          md = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          p = {x["name"]: x for x in md["packages"]}.get(crate)
          if p is None:
              sys.exit(f"{crate}: not a workspace member")
          errs = []
          if p["version"] != want:
              errs.append(f"version {p['version']} != tag {want}")
          if not p.get("description"):
              errs.append("missing `description` (crates.io requires it)")
          if not p.get("license") and not p.get("license_file"):
              errs.append("missing `license` (crates.io requires it)")
          if p.get("publish") == []:
              errs.append("marked publish=false")
          if errs:
              sys.exit(f"Cannot publish {crate}:\n  " + "\n  ".join(errs))
          print(f"OK: {crate} {want}")
          PY

      - name: Check tag commit is contained in main
        run: |
          git fetch origin main
          git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main'

      # Packages and verifies the crate (and resolves its registry deps), so a
      # missing upstream version — e.g. stoffellang needing stoffel-vm-types on
      # crates.io first — fails here rather than mid-publish. No token needed.
      - name: Verify packaging (dry run)
        env:
          CRATE: ${{ steps.ref.outputs.crate }}
        run: cargo publish -p "$CRATE" --locked --dry-run

      # The dry run can keep its archive under target/package/tmp-*. Materialize
      # the canonical archive consumed by the signing and release steps.
      - name: Materialize packaged crate
        env:
          CRATE: ${{ steps.ref.outputs.crate }}
        run: cargo package -p "$CRATE" --locked --no-verify

      # Snapshot the package outside target/package before cargo publish can
      # repackage or overwrite files there.
      - name: Stage packaged crate
        id: stage
        env:
          CRATE: ${{ steps.ref.outputs.crate }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          stage="$RUNNER_TEMP/artifacts"
          base="$CRATE-$VERSION.crate"
          src="target/package/$base"
          if [ ! -f "$src" ]; then
            echo "Expected $src but it is not there" >&2
            exit 1
          fi

          mkdir -p "$stage"
          cp "$src" "$stage/$base"

          echo "artifact=$stage/$base" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Compute packaged crate checksum
        id: checksum
        run: |
          artifact="${{ steps.stage.outputs.artifact }}"
          base="${{ steps.stage.outputs.base }}"
          sha_file="$RUNNER_TEMP/$base.sha256"
          sha256="$(sha256sum "$artifact" | cut -d' ' -f1)"

          printf '%s  %s\n' "$sha256" "$base" > "$sha_file"
          ( cd "$(dirname "$artifact")" && sha256sum -c "$sha_file" )

          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "sha_file=$sha_file" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Check Cosign install
        run: cosign version

      - name: Sign packaged crate
        id: sign
        run: |
          bundle="$RUNNER_TEMP/${{ steps.stage.outputs.base }}.bundle"
          cosign sign-blob --yes \
            --bundle "$bundle" \
            "${{ steps.stage.outputs.artifact }}"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Verify signature before publishing
        run: |
          cosign verify-blob \
            --bundle "${{ steps.sign.outputs.bundle }}" \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/_publish-crate\.yml@refs/(tags|heads)/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.stage.outputs.artifact }}"

      - name: Check whether already published
        id: published
        env:
          CRATE: ${{ steps.ref.outputs.crate }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "stoffel-release-ci (+https://github.com/${{ github.repository }})" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")"
          echo "$CRATE@$VERSION -> HTTP $code"
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        env:
          CRATE: ${{ steps.ref.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "$CRATE" --locked

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ steps.ref.outputs.crate }}
          VERSION: ${{ steps.ref.outputs.version }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          notes_file="$(mktemp)"
          {
            echo "$CRATE $VERSION"
            echo
            echo "crates.io: https://crates.io/crates/$CRATE/$VERSION"
            echo "commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "crate sha256: ${{ steps.checksum.outputs.sha256 }}"
            echo
            echo "The .crate is signed with Sigstore. Verify it with:"
            echo
            echo "    cosign verify-blob \\"
            echo "      --bundle ${{ steps.stage.outputs.base }}.bundle \\"
            echo "      --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/_publish-crate\.yml@refs/(tags|heads)/.+\$' \\"
            echo "      --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "      ${{ steps.stage.outputs.base }}"
          } > "$notes_file"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes_file"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$notes_file"
          fi

          gh release upload "$TAG" \
            "${{ steps.stage.outputs.artifact }}" \
            "${{ steps.checksum.outputs.sha_file }}" \
            "${{ steps.sign.outputs.bundle }}" \
            --clobber
